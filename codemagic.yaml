workflows:
  ios-release:
    name: NotiF iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: NoTiF

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.notif.bookmark
      vars:
        XCODE_SCHEME: 'InstaChat'
      node: 20
      xcode: latest
      cocoapods: default

    scripts:
      - name: Pre-build cleanup
        script: |
          echo "Cleaning Xcode derived data..."
          rm -rf ~/Library/Developer/Xcode/DerivedData

          echo "Cleaning iOS build folder..."
          rm -rf ios/build

          echo "Cleaning Metro cache..."
          rm -rf node_modules/.cache
          rm -rf $TMPDIR/metro-*
          rm -rf $TMPDIR/haste-map-*

          echo "Pre-build cleanup complete"

      - name: Install npm dependencies
        script: npm install --legacy-peer-deps

      - name: Clean and Install CocoaPods
        script: |
          cd ios
          rm -rf Pods
          pod install --repo-update

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Increment build number
        script: |
          cd ios
          agvtool new-version -all $PROJECT_BUILD_NUMBER

      - name: Build IPA
        script: |
          set -euo pipefail
          cd ios
          xcode-project build-ipa \
            --workspace "InstaChat.xcworkspace" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - ios/build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
