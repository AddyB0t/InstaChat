workflows:
  ios-release:
    name: NotiF iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: NoTiF

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.notif.bookmark
      vars:
        XCODE_SCHEME: 'InstaChat'
      node: 20
      xcode: latest
      cocoapods: default

    scripts:
      - name: Pre-build cleanup
        script: |
          echo "Cleaning Xcode derived data..."
          rm -rf ~/Library/Developer/Xcode/DerivedData

          echo "Cleaning iOS build folder..."
          rm -rf ios/build

          echo "Cleaning Metro cache..."
          rm -rf node_modules/.cache
          rm -rf $TMPDIR/metro-*
          rm -rf $TMPDIR/haste-map-*

          echo "Pre-build cleanup complete"

      - name: Install npm dependencies
        script: npm install --legacy-peer-deps

      - name: Clean and Install CocoaPods
        script: |
          cd ios
          rm -rf Pods
          pod install --repo-update

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Increment build number
        script: |
          cd ios
          agvtool new-version -all $PROJECT_BUILD_NUMBER

      - name: Build IPA
        script: |
          set -euo pipefail
          cd ios
          xcode-project build-ipa \
            --workspace "InstaChat.xcworkspace" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - ios/build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-google-play:
    name: NotiF Android Google Play
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      android_signing:
        - notif_upload_keystore
      groups:
        - google_play
      vars:
        PACKAGE_NAME: 'com.instachat'
      node: 20
      java: 17

    scripts:
      - name: Install npm dependencies
        script: npm install --legacy-peer-deps

      - name: Set Android SDK location
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"

      - name: Build Android App Bundle
        script: |
          cd android
          LATEST_GOOGLE_PLAY_BUILD_NUMBER=$(google-play get-latest-build-number --package-name "$PACKAGE_NAME" 2>/dev/null || true)
          case "$LATEST_GOOGLE_PLAY_BUILD_NUMBER" in
            ''|*[!0-9]*)
            UPDATED_BUILD_NUMBER=${BUILD_NUMBER:-26}
            if [ "$UPDATED_BUILD_NUMBER" -lt 26 ]; then
              UPDATED_BUILD_NUMBER=26
            fi
              ;;
            *)
            UPDATED_BUILD_NUMBER=$((LATEST_GOOGLE_PLAY_BUILD_NUMBER + 1))
              ;;
          esac

          ./gradlew bundleRelease -PversionCode="$UPDATED_BUILD_NUMBER" -PversionName=3.0

    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/mapping.txt

    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
